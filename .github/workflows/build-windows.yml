name: Build PathDiver for Windows

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.22.3

      - name: Verify Python source
        shell: pwsh
        run: |
          python -m py_compile desktop_main.py
          python -m py_compile server.py

      - name: Build PathDiver.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PathDiver --add-data "index.html;." --add-data "app.js;." --add-data "style.css;." desktop_main.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\PathDiver.exe")) {
            Write-Error "PathDiver.exe was not created."
            exit 1
          }

          $size = (Get-Item "dist\PathDiver.exe").Length

          Write-Host "PathDiver.exe created successfully."
          Write-Host "Size: $size bytes"

          if ($size -lt 1000000) {
            Write-Error "Executable appears unexpectedly small."
            exit 1
          }

      - name: Upload unsigned executable
        uses: actions/upload-artifact@v4
        with:
          name: PathDiver-Windows-Unsigned
          path: dist/PathDiver.exe
          if-no-files-found: error

      - name: Package PathDiver as MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "msix_payload" -Force | Out-Null
          Copy-Item -Path "msix\AppxManifest.xml" -Destination "msix_payload\AppxManifest.xml"
          Copy-Item -Path "msix\Assets" -Destination "msix_payload\Assets" -Recurse
          Copy-Item -Path "dist\PathDiver.exe" -Destination "msix_payload\PathDiver.exe"
          
          $makeappx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse | Where-Object { $_.FullName -like "*\x64\makeappx.exe" } | Select-Object -First 1).FullName
          Write-Host "Using makeappx: $makeappx"
          & $makeappx pack /d "msix_payload" /p "dist\PathDiver.msix" /nv
          
          if (-not (Test-Path "dist\PathDiver.msix")) {
            Write-Error "PathDiver.msix was not created."
            exit 1
          }
          Write-Host "PathDiver.msix created successfully."

      - name: Upload MSIX Package
        uses: actions/upload-artifact@v4
        with:
          name: PathDiver-Windows-MSIX
          path: dist/PathDiver.msix
          if-no-files-found: error
