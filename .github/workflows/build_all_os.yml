name: Build PathDiver for All OS (Windows, Mac, Linux)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: PathDiver-Windows.exe
            build_cmd: pyinstaller --noconfirm --onefile --windowed --name PathDiver --add-data "index.html;." --add-data "style.css;." --add-data "app.js;." desktop_main.py
            output_path: dist/PathDiver.exe
          
          - os: macos-latest
            artifact_name: PathDiver-macOS.dmg
            build_cmd: |
              pip install pyinstaller pywebview pypdf pillow send2trash
              pyinstaller --noconfirm --windowed --name PathDiver --add-data "index.html:." --add-data "style.css:." --add-data "app.js:." desktop_main.py
              hdiutil create -volname "PathDiver" -srcfolder dist/PathDiver.app -ov -format UDZO dist/PathDiver-macOS.dmg
            output_path: dist/PathDiver-macOS.dmg
          
          - os: ubuntu-latest
            artifact_name: PathDiver-Linux
            build_cmd: |
              sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
              pip install pyinstaller pywebview pypdf pillow send2trash
              pyinstaller --noconfirm --onefile --name PathDiver --add-data "index.html:." --add-data "style.css:." --add-data "app.js:." desktop_main.py
            output_path: dist/PathDiver

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
        
      - name: Build Executable
        run: ${{ matrix.build_cmd }}
        
      - name: Upload Built Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}
